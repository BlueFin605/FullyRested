<div>
  <table mat-table [dataSource]="headers" class="mat-elevation-z8">
    @for (col of columnsSchema; track col) {
      <ng-container [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef>{{ col.label }}</th>
        <td mat-cell *matCellDef="let element">
          @if (!element.isdelete) {
            <div>
              @switch (col.type) {
                @case ("isdelete") {
                  <div class="btn-edit">
                    <button mat-button (click)="delete(element.id)">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </div>
                }
                @case ("isenabled") {
                  <div class="btn-edit">
                    <mat-checkbox
                      class="example-margin"
                      [checked]="element.active"
                      (change)="activeClicked(element.id)"
                    ></mat-checkbox>
                  </div>
                }
                @default {
                  <span>
                    <mat-form-field>
                      <input
                        [type]="col.type"
                        matInput
                        [(ngModel)]="element[col.key]"
                        (ngModelChange)="modelChangeFn($event)"
                      />
                    </mat-form-field>
                  </span>
                }
              }
            </div>
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<div class="addheader">
  <button mat-raised-button color="secondary" (click)="add()">
    Add Header
  </button>
</div>
