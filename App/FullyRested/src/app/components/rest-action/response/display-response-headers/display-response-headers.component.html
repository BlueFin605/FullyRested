@if (getValuesAsArray(); as rows) {
  @if (rows.length == 0) {
    <div class="none">No headers</div>
  } @else {
    <div class="kv-grid">
      @for (row of rows; track row.key) {
        <div class="key">{{ row.key }}</div>
        <div class="value">{{ row.value }}</div>
      }
    </div>
  }
}
