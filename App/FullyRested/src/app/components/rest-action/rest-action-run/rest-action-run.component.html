<app-split-pane>
  <app-edit-request-run
    splitFirst
    [action]="action"
    [(run)]="run"
    (runChange)="onRunChange($event)"
    (nameChange)="onNameChange($event)"
    (execute)="executeAction()"
  ></app-edit-request-run>
  <app-inherited-settings
    splitFirst
    [node]="inheritedNode"
    [environmentId]="collection?.config?.selectedEnvironmentId"
  ></app-inherited-settings>
  <app-display-response
    splitSecond
    [response]="response"
    [sending]="sending"
  ></app-display-response>
</app-split-pane>
