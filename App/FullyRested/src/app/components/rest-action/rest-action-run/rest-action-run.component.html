<app-split-pane>
  <app-edit-request-run
    splitFirst
    [action]="action"
    [(run)]="run"
    (runChange)="onRunChange($event)"
    (nameChange)="onNameChange($event)"
    (execute)="executeAction($event)"
  ></app-edit-request-run>
  <app-display-response
    splitSecond
    [response]="response"
    [sending]="sending"
  ></app-display-response>
</app-split-pane>
