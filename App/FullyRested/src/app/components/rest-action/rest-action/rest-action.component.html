@if (runId) {
  <app-rest-action-run
    [(action)]="_action"
    [collection]="collection"
    [runId]="runId"
    [fullFilename]="_fullFilename"
    (actionChange)="onActionChange($event)"
    (nameChange)="onNameChange($event)"
  ></app-rest-action-run>
} @else {
  <app-split-pane>
    <app-edit-request
      splitFirst
      [(action)]="_action"
      (actionChange)="onActionChange($event)"
      (execute)="executeAction()"
    ></app-edit-request>
    <app-inherited-settings
      splitFirst
      [node]="inheritedNode"
      [environmentId]="collection?.config?.selectedEnvironmentId"
    ></app-inherited-settings>
    <app-display-response
      splitSecond
      [response]="response"
      [sending]="sending"
    ></app-display-response>
  </app-split-pane>
}
