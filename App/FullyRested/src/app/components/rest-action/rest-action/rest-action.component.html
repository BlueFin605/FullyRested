@if (runId) {
  <app-rest-action-run
    [(action)]="_action"
    [collection]="collection"
    [runId]="runId"
    [fullFilename]="_fullFilename"
    (actionChange)="onActionChange($event)"
    (nameChange)="onNameChange($event)"
  ></app-rest-action-run>
} @else {
  <app-split-pane>
    <app-edit-request
      splitFirst
      [(action)]="_action"
      (actionChange)="onActionChange($event)"
      (execute)="executeAction()"
      (openLive)="openLiveSession()"
      (invalidChange)="invalidChange.emit($event)"
    ></app-edit-request>
    <app-inherited-settings
      splitFirst
      [node]="inheritedNode"
      [environmentId]="collection?.config?.selectedEnvironmentId"
    ></app-inherited-settings>
    @if (liveRequest) {
      <app-live-session
        splitSecond
        [request]="liveRequest"
        [message]="liveMessage"
        [environmentId]="collection?.config?.selectedEnvironmentId"
        (dismiss)="liveRequest = undefined"
      ></app-live-session>
    } @else {
      <app-display-response
        splitSecond
        [response]="response"
        [sending]="sending"
      ></app-display-response>
    }
  </app-split-pane>
}
