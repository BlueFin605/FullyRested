<app-key-value-table
  [rows]="secrets"
  (rowsChange)="onRowsChange($event)"
  keyField="$secret"
  valueField="$value"
  keyLabel="Secret"
  [masked]="true"
></app-key-value-table>
<p class="note">
  <mat-icon>lock</mat-icon>
  Values are kept in the OS keychain, not in the collection files. Use them as
  <code ngNonBindable>{{$secret name}}</code>.
</p>
